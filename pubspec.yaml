name: easy_auth
description: "A new Flutter plugin project."
version: 0.0.2
homepage:

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  google_sign_in: ^7.2.0
  google_sign_in_android: ^7.2.2
  google_sign_in_ios: ^6.2.2
  google_sign_in_web: ^1.1.0
  flutter_inappwebview: ^6.1.5
  sign_in_with_apple: ^7.0.1
  fluwx: ^5.7.7
  # Stage 5 — PKCE SHA256 + base64url helpers for OAuth redirect flow
  crypto: ^3.0.3
  # UserCenterPage 头像功能 — 选图 / crop 到 200x200 / PNG encode
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

